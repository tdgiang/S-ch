<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sống Đáng Giá</title>
<meta name="description" content="Bản dịch tiếng Việt của «高性价比人生指南» (HowToLiveBetter) – cẩm nang sống tiết kiệm sức, tiền, thời gian, có dẫn nguồn.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4532a'/%3E%3Cpath d='M8 9h7a3 3 0 0 1 1 .2V24a3 3 0 0 0-1-.2H8zM24 9h-7a3 3 0 0 0-1 .2V24a3 3 0 0 1 1-.2h7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #faf7f2; --fg: #24211d; --muted: #6f675d; --line: #e6dfd4;
  --card: #ffffff; --accent: #b4532a; --accent-soft: #f6e6dc; --note: #fff6dd; --note-line: #e9cf86;
  --fs: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1816; --fg: #e9e4dc; --muted: #a39a8e; --line: #34302b;
    --card: #23201d; --accent: #e8875a; --accent-soft: #3a2a21; --note: #2e2a1f; --note-line: #6b5a2c;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1816; --fg: #e9e4dc; --muted: #a39a8e; --line: #34302b;
  --card: #23201d; --accent: #e8875a; --accent-soft: #3a2a21; --note: #2e2a1f; --note-line: #6b5a2c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: var(--fs)/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }
header.bar {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
header.bar .wrap { display: flex; align-items: center; gap: 8px; padding-bottom: 0; min-height: 52px; }
header.bar .home { font-weight: 700; text-decoration: none; color: var(--fg); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
button.tool {
  min-width: 44px; height: 40px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 10px; font-size: 15px; cursor: pointer;
}
#progress { position: absolute; left: 0; bottom: -1px; height: 3px; background: var(--accent); width: 0; }

/* Home */
.hero { padding: 28px 0 8px; }
.hero h1 { font-size: 1.6em; line-height: 1.25; margin: 0 0 8px; }
.hero p { color: var(--muted); margin: 0 0 12px; font-size: .92em; }
.continue {
  display: block; margin: 16px 0; padding: 14px 16px; border-radius: 12px;
  background: var(--accent-soft); color: var(--fg); text-decoration: none;
}
.continue b { color: var(--accent); }
ol.toc { list-style: none; padding: 0; margin: 16px 0; }
ol.toc li { border-bottom: 1px solid var(--line); }
ol.toc a, ol.toc span { display: flex; gap: 12px; padding: 14px 4px; text-decoration: none; color: var(--fg); align-items: baseline; }
ol.toc .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.8em; }
ol.toc span { color: var(--muted); }
ol.toc span .t::after { content: " · sắp có"; font-size: .8em; }

/* Reader */
.note {
  background: var(--note); border: 1px solid var(--note-line); border-radius: 12px;
  padding: 12px 14px; margin: 20px 0; font-size: .85em; line-height: 1.55;
}
article h1 { font-size: 1.5em; line-height: 1.3; margin: 24px 0 12px; }
article h3 {
  font-size: 1.08em; line-height: 1.45; margin: 36px 0 10px; padding-top: 16px;
  border-top: 1px solid var(--line); scroll-margin-top: 64px;
}
article ul { padding-left: 1.1em; }
article li { margin: 6px 0; }
article li > strong:first-child { color: var(--accent); }
article table { display: block; overflow-x: auto; border-collapse: collapse; font-size: .85em; }
article th, article td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
article blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--line); color: var(--muted); }
article details { font-size: .82em; color: var(--muted); }
article details summary { cursor: pointer; color: var(--accent); font-size: 1.2em; padding: 4px 0; }
article a { word-break: break-word; }
article code { font-size: .9em; }
nav.pager { display: flex; gap: 10px; margin: 40px 0 16px; }
nav.pager a {
  flex: 1; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  text-decoration: none; color: var(--fg); font-size: .9em; line-height: 1.4;
}
nav.pager a small { display: block; color: var(--muted); }
nav.pager a.next { text-align: right; }
footer.credit { font-size: .78em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; margin-top: 24px; line-height: 1.6; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap" style="position:relative">
    <a class="home" href="#">Sống Đáng Giá</a>
    <button class="tool" id="smaller" aria-label="Chữ nhỏ hơn">A−</button>
    <button class="tool" id="bigger" aria-label="Chữ to hơn">A+</button>
    <button class="tool" id="theme" aria-label="Đổi nền sáng/tối">◐</button>
    <div id="progress"></div>
  </div>
</header>
<main class="wrap" id="app"><p class="loading">Đang tải…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const SRC_REPO = 'https://github.com/eternity4719/HowToLiveBetter';
const SRC_COMMIT = 'e2605d3e2242bd6216c9255192b8a8957a08c55a';
const SRC_DATE = '21/10/2026';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

// Font size & theme
let fs = parseInt(store.get('fs')) || 18;
const applyFs = () => document.documentElement.style.setProperty('--fs', fs + 'px');
applyFs();
document.getElementById('smaller').onclick = () => { fs = Math.max(14, fs - 1); store.set('fs', fs); applyFs(); };
document.getElementById('bigger').onclick = () => { fs = Math.min(26, fs + 1); store.set('fs', fs); applyFs(); };
const savedTheme = store.get('theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; store.set('theme', t);
};

const app = document.getElementById('app');
const bar = document.getElementById('progress');
let chapters = [];
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const credit = `<footer class="credit">
  Bản dịch tiếng Việt của «高性价比人生指南» (<a href="${SRC_REPO}">${SRC_REPO.replace('https://', '')}</a>),
  dịch theo phiên bản ngày ${SRC_DATE}. Bản gốc phát hành theo giấy phép
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>; bản dịch này cũng phát hành theo CC BY 4.0.
  Đây là bản dịch đã chỉnh sửa so với bản gốc (dịch sang tiếng Việt, thêm ghi chú). Bản dịch có thể có sai sót, khi cần hãy đối chiếu bản gốc.
</footer>`;

function renderHome() {
  document.title = 'Sống Đáng Giá';
  const lastId = store.get('last');
  const last = chapters.find(c => c.id === lastId && c.done);
  app.innerHTML = `
    <section class="hero">
      <h1>Sống Đáng Giá</h1>
      <p>Bản dịch tiếng Việt của «高性价比人生指南» (Cẩm nang sống đáng giá). Mỗi mục ghi rõ tốn gì, được gì, bằng chứng mạnh cỡ nào và nguồn gốc ở đâu.</p>
      <p>Không cần làm hết. Đây là danh sách để chọn, chọn được một hai điều là đủ.</p>
    </section>
    ${last ? `<a class="continue" href="#/${last.id}">Đọc tiếp: <b>Chương ${+last.id}. ${esc(last.title)}</b></a>` : ''}
    <ol class="toc">
      ${chapters.map(c => c.done
        ? `<li><a href="#/${c.id}"><span class="n">${+c.id}</span><span class="t" style="color:inherit;padding:0">${esc(c.title)}</span></a></li>`
        : `<li><span><span class="n">${+c.id}</span><span class="t" style="padding:0">${esc(c.title)}</span></span></li>`).join('')}
    </ol>
    ${credit}`;
  bar.style.width = 0;
  window.scrollTo(0, 0);
}

function fixLinks(root) {
  root.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    const m = h.match(/^\.\.\/book\/(\d{2})-/) || h.match(/^\.\/(\d{2})-/) || h.match(/^(\d{2})-[^/]*\.md/);
    if (m && chapters.find(c => c.id === m[1] && c.done)) { a.href = '#/' + m[1]; return; }
    if (/^\.\.\/README\.md/.test(h)) { a.href = '#'; return; }
    if (!/^(https?:|#|mailto:)/.test(h)) {
      // Points to an untranslated part of the original repo
      a.href = SRC_REPO + '/blob/' + SRC_COMMIT + '/' + h.replace(/^\.\.\//, '').replace(/^\.\//, 'book/');
    }
    if (/^https?:/.test(a.href) && !a.href.startsWith(location.origin)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
}

// Bold the field label at the start of each bullet ("Chi phí:", "Lợi ích:"…)
const LABELS = /^(\s*)(Chi phí|Nói dễ hiểu|Lợi ích|Mức độ bằng chứng|Ghi chú)\s*:/;
function boldLabels(root) {
  root.querySelectorAll('li').forEach(li => {
    const t = li.firstChild;
    if (t && t.nodeType === 3 && LABELS.test(t.data)) {
      const m = t.data.match(LABELS);
      const s = document.createElement('strong');
      s.textContent = m[2] + ':';
      t.data = t.data.slice(m[0].length);
      li.insertBefore(s, t);
    }
  });
}

// Collapse the long "Nguồn:" (sources) bullets so the phone screen stays readable
function collapseSources(root) {
  root.querySelectorAll('li').forEach(li => {
    if (!/^\s*Nguồn\s*:/.test(li.textContent)) return;
    const d = document.createElement('details');
    d.innerHTML = '<summary>Nguồn</summary>';
    const body = document.createElement('div');
    body.innerHTML = li.innerHTML.replace(/^\s*Nguồn\s*:\s*/, '');
    d.appendChild(body);
    li.replaceChildren(d);
    li.style.listStyle = 'none';
  });
}

let saveTimer;
async function renderChapter(id) {
  const i = chapters.findIndex(c => c.id === id && c.done);
  if (i < 0) return renderHome();
  const ch = chapters[i];
  app.innerHTML = '<p class="loading">Đang tải…</p>';
  let md;
  try {
    const r = await fetch(`chapters/${id}.md`);
    if (!r.ok) throw new Error(r.status);
    md = await r.text();
  } catch (e) {
    app.innerHTML = '<p class="loading">Không tải được chương này. Kiểm tra mạng rồi thử lại.</p>';
    return;
  }
  if (location.hash !== '#/' + id) return; // user navigated away meanwhile
  document.title = `${+id}. ${ch.title} · Sống Đáng Giá`;
  const prev = chapters.slice(0, i).reverse().find(c => c.done);
  const next = chapters.slice(i + 1).find(c => c.done);
  app.innerHTML = `
    <div class="note">Nội dung gốc viết cho người sống ở Trung Quốc. Phần luật, bảo hiểm, giá cả, số điện thoại, thủ tục là theo Trung Quốc, không áp dụng trực tiếp ở Việt Nam. Phần sức khoẻ và khoa học thì dùng chung được, nhưng nên hỏi bác sĩ trước khi làm theo.</div>
    <article>${DOMPurify.sanitize(marked.parse(md))}</article>
    <nav class="pager">
      ${prev ? `<a class="prev" href="#/${prev.id}"><small>← Chương trước</small>${+prev.id}. ${esc(prev.title)}</a>` : ''}
      ${next ? `<a class="next" href="#/${next.id}"><small>Chương sau →</small>${+next.id}. ${esc(next.title)}</a>` : ''}
    </nav>
    ${credit}`;
  const art = app.querySelector('article');
  fixLinks(art);
  boldLabels(art);
  collapseSources(art);
  store.set('last', id);
  const y = parseInt(store.get('pos-' + id)) || 0;
  requestAnimationFrame(() => window.scrollTo(0, y));
  onScroll();
}

function onScroll() {
  const id = (location.hash.match(/^#\/(\d{2})$/) || [])[1];
  if (!id) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = max > 0 ? (scrollY / max * 100) + '%' : 0;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set('pos-' + id, Math.round(scrollY)), 300);
}
addEventListener('scroll', onScroll, { passive: true });

function route() {
  const id = (location.hash.match(/^#\/(\d{2})$/) || [])[1];
  id ? renderChapter(id) : renderHome();
}
addEventListener('hashchange', route);

fetch('chapters.json').then(r => r.json()).then(list => { chapters = list; route(); })
  .catch(() => { app.innerHTML = '<p class="loading">Không tải được mục lục. Kiểm tra mạng rồi thử lại.</p>'; });
</script>
</body>
</html>
